<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0e7c66">
<title>Repeat / Speaking（リピスラ）</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main id="app">

  <!-- S01 ホーム -->
  <section class="screen active" id="screen-home">
    <header class="home-head">
      <h1>Repeat / Speaking</h1>
      <p class="subtitle">リピスラ — 繰り返して、スラスラ話そう。</p>
      <p class="home-status" id="home-status">問題を読み込んでいます。</p>
    </header>

    <nav class="menu">
      <button type="button" class="btn primary big" id="btn-start" disabled>学習をはじめる（今日の10問）</button>

      <div class="menu-group">
        <button type="button" class="btn menu-item" disabled>① 型の練習 <span class="badge">Phase 2 で実装予定</span></button>
        <button type="button" class="btn menu-item" disabled>② 時制の練習 <span class="badge">Phase 2 で実装予定</span></button>
        <button type="button" class="btn menu-item" disabled>③ 動詞の練習 <span class="badge">Phase 2 で実装予定</span></button>
        <button type="button" class="btn menu-item" disabled>④ シャッフル <span class="badge">Phase 2 で実装予定</span></button>
        <button type="button" class="btn menu-item" disabled>⑤ 苦手を復習 <span class="badge">Phase 3 で実装予定</span></button>
      </div>

      <div class="menu-group sub-menu">
        <button type="button" class="btn menu-item" id="btn-open-records">学習記録</button>
        <button type="button" class="btn menu-item" id="btn-open-settings">設定</button>
      </div>
    </nav>

    <footer class="home-foot">
      <p id="home-version"></p>
      <p class="note">姉妹アプリ: Magical / Reading（マジスラ）</p>
    </footer>
  </section>

  <!-- S02 学習設定 / S06 設定 -->
  <section class="screen" id="screen-settings">
    <header class="page-head">
      <h2>設定</h2>
    </header>
    <div class="form">
      <label>問題数
        <select id="set-count">
          <option value="5">5問</option>
          <option value="10" selected>10問</option>
          <option value="20">20問</option>
        </select>
      </label>
      <p class="note">Phase 1 の問題は10問のため、20問を選んでも10問になります。</p>
      <label>難易度
        <select id="set-level">
          <option value="beginner" selected>初級</option>
          <option value="intermediate">中級</option>
          <option value="advanced">上級</option>
        </select>
      </label>
      <label>回答方法
        <select id="set-method">
          <option value="voice" selected>音声</option>
          <option value="text">テキスト</option>
        </select>
      </label>
      <label>ヒント
        <select id="set-hint">
          <option value="off" selected>オフ</option>
          <option value="on">オン</option>
        </select>
      </label>
      <label>お手本再生
        <select id="set-playback">
          <option value="manual" selected>手動</option>
          <option value="auto">回答後自動</option>
        </select>
      </label>
      <label>正解後の進行
        <select id="set-after">
          <option value="manual" selected>手動</option>
          <option value="auto">自動</option>
        </select>
      </label>
      <label>音声言語
        <select id="set-lang">
          <option value="en-US" selected>en-US</option>
          <option value="en-GB">en-GB</option>
        </select>
      </label>
    </div>

    <div class="form update-box">
      <p id="app-version"></p>
      <button type="button" class="btn sub" id="btn-reload">最新版を読み込む</button>
      <p class="note" id="reload-result"></p>
      <p class="note">ログインとクラウド同期は初版では行いません。学習記録はこの端末の中に保存されます。</p>
    </div>

    <div class="nav-row">
      <button type="button" class="btn sub" id="btn-settings-back">戻る</button>
    </div>
  </section>

  <!-- S03 問題・発話 / S04 回答確認（状態切り替え） -->
  <section class="screen" id="screen-practice">
    <div id="practice-main"></div>
  </section>

  <!-- S05 セット結果 -->
  <section class="screen" id="screen-summary">
    <header class="page-head">
      <h2>セット結果</h2>
    </header>
    <div id="summary-body"></div>
    <div class="row-btns">
      <button type="button" class="btn sub" id="btn-summary-home">ホームに戻る</button>
      <button type="button" class="btn primary" id="btn-summary-retry">もう一度練習する</button>
    </div>
  </section>

  <!-- S06 学習記録 -->
  <section class="screen" id="screen-records">
    <header class="page-head">
      <h2>学習記録</h2>
    </header>
    <div id="records-body"></div>
    <div class="nav-row">
      <button type="button" class="btn sub" id="btn-records-back">戻る</button>
    </div>
  </section>

</main>

<script src="app.js"></script>
</body>
</html>
